name: veritech-scan

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  APP_DOMAIN: ${APP_DOMAIN:-localhost}
  APP_URL: ${APP_URL:-http://localhost:3000}
  MARKETING_SITE_URL: ${MARKETING_SITE_URL:-https://veritechdiligence.com}
  PRODUCT_NAME: ${PRODUCT_NAME:-Veritech Scan}
  PARENT_BRAND: ${PARENT_BRAND:-Veritech Diligence}
  REPORT_NAME: ${REPORT_NAME:-Technical Acquisition Brief}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://veritech_scan:change-me@postgres:5432/veritech_scan}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-1440}
  INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@example.com}
  INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-change-me}
  SCAN_MAX_TOTAL_MINUTES: ${SCAN_MAX_TOTAL_MINUTES:-10}
  SCAN_DEFAULT_REQUEST_DELAY_SECONDS: ${SCAN_DEFAULT_REQUEST_DELAY_SECONDS:-1.5}
  SCAN_MAX_PAGES: ${SCAN_MAX_PAGES:-50}
  SCAN_WORKER_CONCURRENCY: ${SCAN_WORKER_CONCURRENCY:-1}
  SCAN_PAGE_TIMEOUT_SECONDS: ${SCAN_PAGE_TIMEOUT_SECONDS:-15}
  SCAN_CREATE_RATE_LIMIT_PER_HOUR: ${SCAN_CREATE_RATE_LIMIT_PER_HOUR:-10}
  GOOGLE_PAGESPEED_API_KEY: ${GOOGLE_PAGESPEED_API_KEY:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  ARTIFACT_STORAGE_BACKEND: ${ARTIFACT_STORAGE_BACKEND:-local}
  ARTIFACT_STORAGE_LOCAL_PATH: /data/artifacts
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  PYTHONUNBUFFERED: "1"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veritech_scan}
      POSTGRES_USER: ${POSTGRES_USER:-veritech_scan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veritech_scan} -d ${POSTGRES_DB:-veritech_scan}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      <<: *api-env
    volumes:
      - ./apps/api:/app
      - ./packages/shared:/packages/shared
      - ./tests:/tests
      - scan_artifacts:/data/artifacts
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-env
    volumes:
      - ./apps/api:/app
      - ./packages/shared:/packages/shared
      - scan_artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["dramatiq", "app.tasks.scan_tasks", "--processes", "1", "--threads", "1"]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_PRODUCT_NAME: ${PRODUCT_NAME:-Veritech Scan}
      NEXT_PUBLIC_PARENT_BRAND: ${PARENT_BRAND:-Veritech Diligence}
      NEXT_PUBLIC_MARKETING_SITE_URL: ${MARKETING_SITE_URL:-https://veritechdiligence.com}
      API_INTERNAL_URL: http://api:8000
    volumes:
      - ./apps/web:/app
      - ./packages/shared:/packages/shared
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    command: ["npm", "run", "dev"]

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  scan_artifacts:
  app_uploads:

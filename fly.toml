# Veritech Scan — Fly.io app configuration for the web/API Machine.
#
# Scan-runner Machines are NOT managed here — they're created on demand,
# one per scan, via the Fly Machines API (apps/api/app/services/
# fly_machines.py + scan_orchestrator.py::request_scan_runner) and destroy
# themselves when the scan finishes (config.auto_destroy = true). This file
# only configures the always-deployed, autostop/autostart web/API process.
#
# `app` below is a placeholder — scripts/deploy-fly.sh always passes
# --app "$FLY_APP_NAME" explicitly, which overrides it. See
# docs/fly-deployment.md.

app = "veritech-scan"
primary_region = "iad"

[build]

[env]
  APP_ENV = "production"
  PORT = "8080"

[processes]
  # The image's ENTRYPOINT is already /app/scripts/entrypoint.sh (see
  # Dockerfile) — this value becomes its argument(s), not a second copy of
  # the script path.
  app = "web"

[http_service]
  internal_port = 8080
  force_https = true
  processes = ["app"]

  # Zero always-on compute for the web/API role: Fly stops the Machine when
  # it's had no traffic for a while, and the proxy auto-starts it again on
  # the next incoming request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

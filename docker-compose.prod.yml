name: veritech-scan

x-api-env: &api-env
  APP_ENV: production
  APP_DOMAIN: ${APP_DOMAIN}
  APP_URL: ${APP_URL}
  MARKETING_SITE_URL: ${MARKETING_SITE_URL}
  PRODUCT_NAME: ${PRODUCT_NAME:-Veritech Scan}
  PARENT_BRAND: ${PARENT_BRAND:-Veritech Diligence}
  REPORT_NAME: ${REPORT_NAME:-Technical Acquisition Brief}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-1440}
  INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
  INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
  SCAN_MAX_TOTAL_MINUTES: ${SCAN_MAX_TOTAL_MINUTES:-10}
  SCAN_DEFAULT_REQUEST_DELAY_SECONDS: ${SCAN_DEFAULT_REQUEST_DELAY_SECONDS:-1.5}
  SCAN_MAX_PAGES: ${SCAN_MAX_PAGES:-50}
  SCAN_WORKER_CONCURRENCY: ${SCAN_WORKER_CONCURRENCY:-1}
  SCAN_PAGE_TIMEOUT_SECONDS: ${SCAN_PAGE_TIMEOUT_SECONDS:-15}
  SCAN_CREATE_RATE_LIMIT_PER_HOUR: ${SCAN_CREATE_RATE_LIMIT_PER_HOUR:-10}
  GOOGLE_PAGESPEED_API_KEY: ${GOOGLE_PAGESPEED_API_KEY:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  ARTIFACT_STORAGE_BACKEND: ${ARTIFACT_STORAGE_BACKEND:-local}
  ARTIFACT_STORAGE_LOCAL_PATH: /data/artifacts
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  PYTHONUNBUFFERED: "1"
  LOG_FORMAT: json

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      <<: *api-env
    volumes:
      - scan_artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-env
    volumes:
      - scan_artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["dramatiq", "app.tasks.scan_tasks", "--processes", "1", "--threads", "${SCAN_WORKER_CONCURRENCY:-1}"]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      NEXT_PUBLIC_PRODUCT_NAME: ${PRODUCT_NAME:-Veritech Scan}
      NEXT_PUBLIC_PARENT_BRAND: ${PARENT_BRAND:-Veritech Diligence}
      NEXT_PUBLIC_MARKETING_SITE_URL: ${MARKETING_SITE_URL}
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    expose:
      - "3000"

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  scan_artifacts:
  app_uploads:
